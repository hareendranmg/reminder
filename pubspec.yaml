name: reminder
description: "A Material 3 reminder app for Linux and Windows with non-dismissible alert windows."
publish_to: 'none'
version: 1.4.0

environment:
  sdk: ^3.10.8

dependencies:
  animations: ^2.1.1
  desktop_multi_window: ^0.3.0
  drift: ^2.30.1
  drift_flutter: ^0.2.8
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.2.0
  intl: ^0.20.2
  launch_at_startup: ^0.5.1
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.1
  sqlite3_flutter_libs: ^0.5.41
  tray_manager: ^0.5.2
  url_launcher: ^6.2.5
  uuid: ^4.5.2
  window_manager: 0.5.1

dev_dependencies:
  build_runner: ^2.10.5
  drift_dev: ^2.30.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter_launcher_icons:
  linux:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.ico"

dependency_overrides:
  uuid: ^4.5.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
