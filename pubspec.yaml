name: reminder
description: "A Material 3 reminder app for Linux and Windows with non-dismissible alert windows."
publish_to: 'none'
version: 1.6.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  desktop_multi_window: ^0.3.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.5.0
  intl: ^0.20.3
  launch_at_startup: ^0.5.1
  # 10.x needs win32 6, which launch_at_startup (via win32_registry 2) doesn't allow yet.
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  tray_manager: ^0.8.3
  url_launcher: ^6.3.3
  # Kept on 0.5.x: 0.6 is a rewrite whose 0.5-compatible API always targets the
  # active window, which breaks the per-engine alert windows.
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter_launcher_icons:
  linux:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.ico"

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
